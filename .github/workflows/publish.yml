name: Publish image

# Builds the image on every PR (never pushed) and publishes it to GitHub Container Registry:
#   - push to main      -> ghcr.io/juanberrio0399/dockerized-data-tool:edge
#   - tag vX.Y.Z        -> :X.Y.Z, :X.Y, :X (X >= 1) and :latest
# Only GITHUB_TOKEN is used: no registry account or stored secret.
#
# Publishing is gated: the image is built once, loaded, scanned with Trivy and smoke tested, and that
# exact image is then pushed (docker tag + docker push). Nothing is rebuilt for the push, so what is
# published is byte for byte what was scanned; the job re-reads the pushed manifest and fails if its
# config digest differs. SLSA provenance and an SPDX SBOM are attested for the pushed digest.
# No cross-run build cache on purpose: every build re-runs `apt-get upgrade` for fresh security fixes.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      test_tag:
        description: "Publish a throwaway tag (e.g. citest) to verify the push path; delete the package version afterwards"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Everything except a pull request publishes; a manual run only publishes when a test tag is given.
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_tag != '') }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # signing the provenance and SBOM attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the commit time as the build timestamp (reproducible image ID)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Compute tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest=auto adds :latest only for stable semver tags (not for pre-releases or edge).
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=ref,event=pr
            type=raw,value=${{ inputs.test_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.test_tag != '' }}
          # source, revision, version, created and licenses (MIT, from the repo) are generated automatically.
          labels: |
            org.opencontainers.image.title=dockerized-data-tool
            org.opencontainers.image.description=CSV summary tool with schema validation, packaged as a non-root container

      - name: Build and load the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the image (Trivy gate before publishing)
        # Same policy as tests.yml: fail on CRITICAL/HIGH findings that already have a fix.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate the SBOM of the scanned image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: spdx-json
          output: sbom.spdx.json

      - name: Smoke test (runs, non-root)
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          docker run --rm "$IMAGE_ID"
          test "$(docker run --rm "$IMAGE_ID" id -u)" != "0"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image (nothing is rebuilt)
        id: publish
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
            [ -n "$first" ] || first="$tag"
          done <<< "$TAGS"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$first" | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $first@$digest"

      - name: Verify the published image is the scanned image
        if: env.PUBLISH == 'true'
        env:
          SCANNED: ${{ steps.build.outputs.imageid }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker image rm -f "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
          docker pull -q "$IMAGE@$DIGEST" >/dev/null
          published=$(docker inspect --format '{{.Id}}' "$IMAGE@$DIGEST")
          echo "scanned:   $SCANNED"
          echo "published: $published"
          test -n "$SCANNED" && test "$SCANNED" = "$published"

      - name: Attest the build provenance (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "## Image"
            if [ "$PUBLISH" = "true" ]; then echo "Pushed: \`$DIGEST\`"; else echo "Built and scanned, not pushed."; fi
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
