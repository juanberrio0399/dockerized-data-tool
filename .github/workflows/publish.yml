name: Publish image

# Builds the image on every PR (never pushed) and publishes it to GitHub Container Registry:
#   - push to main      -> ghcr.io/juanberrio0399/dockerized-data-tool:edge
#   - tag vX.Y.Z        -> :X.Y.Z, :X.Y, :X (X >= 1) and :latest
# Only GITHUB_TOKEN is used: no registry account or stored secret.
#
# Publishing is gated: the image is built, loaded and scanned with Trivy first. The push step
# rebuilds from the same builder cache with a fixed SOURCE_DATE_EPOCH, and the job fails if the
# resulting image ID differs from the one that was scanned, so only the scanned image is published.
# No cross-run build cache on purpose: every build re-runs `apt-get upgrade` for fresh security fixes.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the commit time as the build timestamp (reproducible image ID)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Compute tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest=auto adds :latest only for stable semver tags (not for pre-releases or edge).
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=ref,event=pr
          # source, revision, version, created and licenses (MIT, from the repo) are generated automatically.
          labels: |
            org.opencontainers.image.title=dockerized-data-tool
            org.opencontainers.image.description=CSV summary tool with schema validation, packaged as a non-root container

      - name: Build and load the image for scanning
        id: scan-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: data-tool:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the image (Trivy gate before publishing)
        # Same policy as tests.yml: fail on CRITICAL/HIGH findings that already have a fix.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: data-tool:scan
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test (runs, non-root)
        run: |
          docker run --rm data-tool:scan
          test "$(docker run --rm data-tool:scan id -u)" != "0"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (PRs build only, nothing is pushed)
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,push=${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance and an SPDX SBOM are attached to the pushed image (free, stored in GHCR).
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Verify the published image is the scanned image
        env:
          SCANNED: ${{ steps.scan-build.outputs.imageid }}
          PUBLISHED: ${{ steps.publish.outputs.imageid }}
        run: |
          echo "scanned:   $SCANNED"
          echo "published: $PUBLISHED"
          test -n "$SCANNED" && test "$SCANNED" = "$PUBLISHED"

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Image"
            if [ "$EVENT" = "pull_request" ]; then echo "Built and scanned, not pushed (pull request)."; else echo "Pushed: \`$DIGEST\`"; fi
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
