name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q
      - name: Build Docker image and run it
        run: |
          docker build -t data-tool .
          docker run --rm data-tool
      - name: Check the container runs without root
        run: |
          uid=$(docker run --rm data-tool id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Check error handling inside the container
        run: |
          set +e
          docker run --rm data-tool python app.py /data/missing.csv
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2
