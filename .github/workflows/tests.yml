name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # weekly: new CVEs appear even when the code does not change

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: Lint (ruff check)
        run: ruff check --output-format=github .
      - name: Check formatting (ruff format)
        run: ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Build Docker image and run it
        run: |
          docker build -t data-tool .
          docker run --rm data-tool
      - name: Scan the image for vulnerabilities (Trivy)
        # Pinned to the v0.36.0 commit. Fails only on CRITICAL/HIGH findings that already have a fix,
        # so the check stays actionable instead of red forever on unpatched base-image CVEs.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: data-tool
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"
      - name: Check the container runs without root
        run: |
          uid=$(docker run --rm data-tool id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Check error handling inside the container
        run: |
          set +e
          docker run --rm data-tool python app.py /data/missing.csv
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2
