<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="How Dockerized Data Tool works: the CLI reads a CSV, parses it, checks it against a schema contract, prints the summary and can ask Gemini to explain it; the release builds for two platforms, scans with Trivy, adds an SBOM and a smoke test, pushes the scanned digest, attests provenance and publishes a multi-arch index">
<title>How Dockerized Data Tool works: the CLI reads a CSV, parses it, checks it against a schema contract, prints the summary and can ask Gemini to explain it; the release builds for two platforms, scans with Trivy, adds an SBOM and a smoke test, pushes the scanned digest, attests provenance and publishes a multi-arch index</title>
