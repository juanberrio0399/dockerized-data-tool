# Tooling configuration only: the tool runs as `python app.py`, it is not installed as a package.

[tool.ruff]
target-version = "py312"  # same Python as the python:3.12-slim image
line-length = 120

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, import sorting, likely bugs, and outdated syntax for 3.12.
select = ["E", "W", "F", "I", "B", "UP"]
